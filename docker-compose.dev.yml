version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lead_mgmt_postgres_dev
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lead_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-lead_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lead_password_dev_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lead_user} -d ${POSTGRES_DB:-lead_management_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead_mgmt_backend_dev
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-change-in-production-1234567890}
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: ${POSTGRES_DB:-lead_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-lead_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lead_password_dev_123}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgres://${POSTGRES_USER:-lead_user}:${POSTGRES_PASSWORD:-lead_password_dev_123}@postgres:5432/${POSTGRES_DB:-lead_management_db}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_dev:
